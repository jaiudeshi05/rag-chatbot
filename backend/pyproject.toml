[project]
name = "rag-backend"
version = "0.1.0"
description = "Production RAG Backend"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.5",
    "authlib>=1.7.2",
    "boto3>=1.43.46",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
