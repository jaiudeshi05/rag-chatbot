services:

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile

    container_name: rag_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - .env

    depends_on:
      - redis
      - qdrant

  redis:
    image: redis:7-alpine

    container_name: rag_redis

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest

    container_name: rag_qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: